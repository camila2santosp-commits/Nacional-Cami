<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Escudo Nacional -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1E4D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001845;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Forma de escudo -->
  <path d="M 50 10 L 80 30 L 80 60 Q 50 85 50 85 Q 50 85 20 60 L 20 30 Z"
        fill="url(#shieldGrad)" stroke="#C8102E" stroke-width="2"/>

  <!-- Letra N -->
  <text x="50" y="65" font-family="Oswald, sans-serif" font-size="36" font-weight="bold"
        fill="#C8102E" text-anchor="middle" dominant-baseline="central">N</text>
</svg>
