<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Escudo del Club Nacional de Football de Uruguay -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1E4D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001845;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8102E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A00D24;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Marco exterior - Escudo -->
  <path d="M 100 20 L 170 60 L 170 130 Q 100 190 100 190 Q 100 190 30 130 L 30 60 Z"
        fill="url(#shieldGrad)" stroke="#C8102E" stroke-width="3"/>

  <!-- Banda diagonal roja (característica del Nacional) -->
  <path d="M 50 60 L 150 140" stroke="url(#redGrad)" stroke-width="20" opacity="0.8"/>

  <!-- Letra N grande en blanco -->
  <text x="100" y="110" font-family="Oswald, sans-serif" font-size="80" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" letter-spacing="2">N</text>

  <!-- Punto característico -->
  <circle cx="100" cy="60" r="8" fill="#C8102E"/>
  <circle cx="100" cy="170" r="8" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/>

  <!-- Años del club (opcional) -->
  <text x="100" y="210" font-family="Inter, sans-serif" font-size="14" font-weight="bold"
        fill="#C8102E" text-anchor="middle">1846</text>
</svg>
